<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976D2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>血压笔记</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* === Reset & Base === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #1976D2;
  --primary-dark: #1565C0;
  --primary-light: #42A5F5;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --text: #212121;
  --text-secondary: #757575;
  --text-hint: #9E9E9E;
  --divider: #E0E0E0;
  --danger: #F44336;
  --success: #4CAF50;
  --warning: #FF9800;
  --elevated: #FFC107;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.1);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* === App Shell === */
.app-shell { display: flex; flex-direction: column; height: 100vh; max-width: 480px; margin: 0 auto; position: relative; overflow: hidden; }

/* === Header === */
.app-header {
  background: var(--primary); color: #fff; padding: 12px 16px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; min-height: 52px;
  position: relative; z-index: 10;
}
.app-header h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
.header-left { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
.header-right { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.header-btn { background: none; border: none; color: #fff; font-size: 20px; padding: 4px 8px; cursor: pointer; }

/* === Main Content === */
.main-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.page { display: none; padding: 16px; padding-bottom: 80px; animation: fadeIn .2s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* === Bottom Nav === */
.bottom-nav {
  display: flex; background: var(--card); border-top: 1px solid var(--divider);
  flex-shrink: 0; z-index: 10; padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-item {
  flex: 1; text-align: center; padding: 6px 0 4px; cursor: pointer; transition: all .15s;
  color: var(--text-secondary); border: none; background: none; font-family: inherit;
}
.nav-item .nav-icon { font-size: 22px; display: block; }
.nav-item .nav-label { font-size: 11px; margin-top: 1px; }
.nav-item.active { color: var(--primary); }

/* === Cards === */
.card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); margin-bottom: 12px;
}

/* === BP Status Card === */
.bp-status-card { position: relative; overflow: hidden; }
.bp-status-card .bg-accent {
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.bp-values { display: flex; justify-content: space-around; text-align: center; margin: 16px 0; }
.bp-value-item { flex: 1; position: relative; }
.bp-value-item + .bp-value-item { border-left: 1px solid var(--divider); }
.bp-value-label { font-size: 13px; color: var(--text-secondary); }
.bp-value-num { font-size: 32px; font-weight: 700; line-height: 1.2; }
.bp-value-unit { font-size: 13px; color: var(--text-secondary); }
.bp-tag {
  display: inline-block; padding: 3px 12px; border-radius: 20px;
  font-size: 14px; font-weight: 600; margin-bottom: 8px;
}
.bp-advice { font-size: 14px; color: var(--text-secondary); line-height: 1.5; padding: 0 4px; }

/* === Form === */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--divider); border-radius: 8px;
  font-size: 16px; font-family: inherit; transition: border-color .15s; background: #fff; color: var(--text);
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary); }
.form-input.error { border-color: var(--danger); }
.form-textarea { resize: vertical; min-height: 60px; }
.form-input-suffix { position: relative; }
.form-input-suffix input { padding-right: 44px; }
.form-input-suffix .suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-hint); font-size: 14px; }

/* === Buttons === */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 500;
  font-family: inherit; border: none; cursor: pointer; transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-block { display: flex; width: 100%; }
.btn-outline { background: transparent; border: 1.5px solid var(--divider); color: var(--text); }
.btn-danger { color: var(--danger); }
.btn-sm { padding: 6px 14px; font-size: 14px; }
.btn-icon { padding: 8px; border-radius: 50%; background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-secondary); }

/* === History List === */
.record-item {
  display: flex; align-items: center; padding: 14px 0;
  border-bottom: 1px solid var(--divider); cursor: pointer;
}
.record-item:last-child { border-bottom: none; }
.record-indicator { width: 4px; height: 44px; border-radius: 2px; margin-right: 12px; flex-shrink: 0; }
.record-info { flex: 1; min-width: 0; }
.record-date { font-size: 14px; font-weight: 500; }
.record-bp { font-size: 22px; font-weight: 700; margin-top: 2px; }
.record-time { font-size: 13px; color: var(--text-secondary); text-align: right; }
.record-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; display: inline-block; }

/* === Chart === */
.chart-container { position: relative; width: 100%; }
.chart-canvas { width: 100%; height: 260px; }
.chart-legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 12px; }
.chart-legend-item { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text-secondary); }
.chart-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* === Stats Grid === */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card { padding: 14px; border-radius: 10px; background: var(--bg); }
.stat-card .stat-icon { font-size: 18px; }
.stat-card .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.stat-card .stat-value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.stat-card .stat-unit { font-size: 12px; color: var(--text-secondary); font-weight: 400; }

/* === Empty State === */
.empty-state { text-align: center; padding: 48px 24px; }
.empty-state .empty-icon { font-size: 64px; opacity: .3; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
.empty-state p { font-size: 14px; color: var(--text-hint); }

/* === Toast === */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: #323232; color: #fff; padding: 10px 24px; border-radius: 8px;
  font-size: 14px; z-index: 100; opacity: 0; transition: all .3s; white-space: nowrap;
  max-width: calc(100vw - 32px); text-overflow: ellipsis; overflow: hidden;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* === Modal === */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50;
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; }
.modal h3 { font-size: 18px; margin-bottom: 12px; }
.modal p { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* === Date/Time Inputs === */
.datetime-row { display: flex; gap: 12px; }
.datetime-row .form-group { flex: 1; }

/* === Quick Stats === */
.stats-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.stat-mini { text-align: center; padding: 12px 4px; border-radius: 8px; background: var(--bg); }
.stat-mini .num { font-size: 20px; font-weight: 700; }
.stat-mini .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* === Period Selector === */
.period-selector { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 16px; }
.period-btn { flex: 1; text-align: center; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; font-family: inherit; color: var(--text-secondary); transition: all .15s; }
.period-btn.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow); }

/* === Edit Mode === */
.edit-actions { display: flex; gap: 8px; margin-top: 4px; }
.edit-actions .btn { flex: 1; }

/* === Section Title === */
.section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-title h2 { font-size: 16px; font-weight: 600; }
.section-title a { font-size: 14px; color: var(--primary); cursor: pointer; }

/* === About page === */
.about-section { text-align: center; }
.about-section .app-icon { font-size: 48px; margin: 16px 0; }
.about-section h3 { font-size: 20px; margin-bottom: 4px; }
.about-section .version { color: var(--text-secondary); font-size: 14px; margin-bottom: 16px; }
.about-section p { color: var(--text-secondary); font-size: 14px; margin-bottom: 8px; }
.about-section .disclaimer { margin-top: 16px; padding: 12px; background: #FFF8E1; border-radius: 8px; font-size: 12px; color: #795548; line-height: 1.5; }

/* === Responsive === */
@media (min-width: 480px) {
  .app-shell { border-left: 1px solid var(--divider); border-right: 1px solid var(--divider); }
}
</style>
</head>
<body>

<div class="app-shell" id="app">
  <!-- Header -->
  <header class="app-header">
    <div class="header-left"><button class="header-btn" id="backBtn" style="display:none" onclick="goBack()">&#8592;</button></div>
    <h1 id="pageTitle">血压笔记</h1>
    <div class="header-right">
      <button class="header-btn" id="chartBtn" onclick="navigate('charts')" title="趋势">&#128200;</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" id="mainContent">

    <!-- ===== HOME PAGE ===== -->
    <div class="page active" id="page-home">
      <div id="homeContent"></div>
    </div>

    <!-- ===== ADD RECORD PAGE ===== -->
    <div class="page" id="page-record">
      <form id="recordForm" onsubmit="saveRecord(event)">
        <div class="card">
          <div class="form-group">
            <label>测量时间</label>
            <div class="datetime-row">
              <div class="form-group">
                <input type="date" class="form-input" id="recDate">
              </div>
              <div class="form-group">
                <input type="time" class="form-input" id="recTime">
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="form-row">
            <div class="form-group">
              <label>收缩压 (高压)</label>
              <div class="form-input-suffix">
                <input type="number" class="form-input" id="recSystolic" placeholder="120" min="30" max="300" required>
                <span class="suffix">mmHg</span>
              </div>
            </div>
            <div class="form-group">
              <label>舒张压 (低压)</label>
              <div class="form-input-suffix">
                <input type="number" class="form-input" id="recDiastolic" placeholder="80" min="30" max="300" required>
                <span class="suffix">mmHg</span>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>心率</label>
            <div class="form-input-suffix">
              <input type="number" class="form-input" id="recHeartRate" placeholder="72" min="20" max="300" required>
              <span class="suffix">bpm</span>
            </div>
          </div>
          <div id="recPreview" style="display:none;margin-top:8px;padding:8px 12px;border-radius:8px;font-size:14px;font-weight:500;"></div>
        </div>
        <div class="card">
          <div class="form-group">
            <label>备注（选填）</label>
            <textarea class="form-textarea" id="recNotes" placeholder="例如：运动后、服药后、早晨空腹..." maxlength="200"></textarea>
          </div>
        </div>
        <div class="edit-actions" id="editActions" style="display:none;">
          <button type="button" class="btn btn-outline btn-block" onclick="cancelEdit()">取消编辑</button>
          <button type="submit" class="btn btn-primary btn-block" id="saveBtn">保存记录</button>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="saveBtnSingle" style="margin-top:4px;">保存记录</button>
      </form>
    </div>

    <!-- ===== HISTORY PAGE ===== -->
    <div class="page" id="page-history">
      <div id="historyContent"></div>
    </div>

    <!-- ===== CHARTS PAGE ===== -->
    <div class="page" id="page-charts">
      <div class="period-selector" id="periodSelector">
        <button class="period-btn active" data-period="week">周</button>
        <button class="period-btn" data-period="month">月</button>
        <button class="period-btn" data-period="quarter">季</button>
      </div>
      <div class="card">
        <div class="chart-container">
          <div class="chart-legend">
            <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#4CAF50"></div>收缩压</div>
            <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#FFC107"></div>舒张压</div>
          </div>
          <canvas class="chart-canvas" id="bpChart"></canvas>
          <div class="empty-state" id="chartEmpty" style="display:none;padding:32px 16px;">
            <div class="empty-icon">&#128200;</div>
            <h3>暂无足够数据</h3>
            <p>记录更多血压数据后，这里会显示趋势图</p>
          </div>
        </div>
      </div>
      <div id="statsContent"></div>
      <button class="btn btn-outline btn-block" onclick="exportCSV()" style="margin-top:8px;">&#128229; 导出CSV数据</button>
    </div>

    <!-- ===== SETTINGS PAGE ===== -->
    <div class="page" id="page-settings">
      <div class="card about-section">
        <div class="app-icon">&#128147;</div>
        <h3>血压笔记</h3>
        <div class="version">版本 1.0.0</div>
        <p>记录每日血压，关注心血管健康</p>
        <p style="font-size:13px;color:var(--text-secondary);">所有数据保存在本地，不会上传到任何服务器</p>
        <div class="disclaimer">
          免责声明：本应用仅供参考，不构成医疗诊断。如有高血压症状，请及时就医。
        </div>
      </div>
      <div class="card">
        <button class="btn btn-outline btn-block" onclick="exportCSV()">&#128229; 导出数据 (CSV)</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" onclick="confirmClearAll()">&#128465; 清空全部数据</button>
      </div>
      <div style="text-align:center;padding:16px;color:var(--text-hint);font-size:12px;">
        数据统计：共 <span id="totalRecordsCount">0</span> 条记录
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="navigate('home')">
      <span class="nav-icon">&#127968;</span>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-item" data-page="record" onclick="navigate('record')">
      <span class="nav-icon">&#43;</span>
      <span class="nav-label">记录</span>
    </button>
    <button class="nav-item" data-page="history" onclick="navigate('history')">
      <span class="nav-icon">&#128214;</span>
      <span class="nav-label">历史</span>
    </button>
    <button class="nav-item" data-page="charts" onclick="navigate('charts')">
      <span class="nav-icon">&#128200;</span>
      <span class="nav-label">趋势</span>
    </button>
    <button class="nav-item" data-page="settings" onclick="navigate('settings')">
      <span class="nav-icon">&#9881;</span>
      <span class="nav-label">设置</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3 id="modalTitle">确认</h3>
    <p id="modalMessage">确定要执行此操作吗？</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="modalConfirmBtn" onclick="closeModal()">确定</button>
    </div>
  </div>
</div>

<script>
// ============ Database (IndexedDB) ============
const DB_NAME = 'bp_db';
const DB_VER = 1;
const STORE_NAME = 'records';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
        store.createIndex('date', 'date', { unique: false });
        store.createIndex('timestamp', 'timestamp', { unique: false });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function getAllRecords() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.index('timestamp').openCursor(null, 'prev');
    const records = [];
    req.onsuccess = e => {
      const cursor = e.target.result;
      if (cursor) { records.push(cursor.value); cursor.continue(); }
      else resolve(records);
    };
    req.onerror = e => reject(e.target.error);
  });
}

async function addRecord(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.add(record);
    req.onsuccess = () => resolve(req.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function updateRecord(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(record);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

async function deleteRecord(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

async function clearAllRecords() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.clear();
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e.target.error);
  });
}

// ============ BP Classification ============
function classifyBP(systolic, diastolic) {
  if (systolic >= 180 || diastolic >= 120) return { level: 'crisis', label: '高血压危象', color: '#D32F2F', advice: '⚠ 高血压危象！请立即就医！' };
  if (systolic >= 140 || diastolic >= 90) return { level: 'stage2', label: '高血压2级', color: '#F44336', advice: '高血压2级，请及时就医，遵医嘱服药。' };
  if (systolic >= 130 || diastolic >= 80) return { level: 'stage1', label: '高血压1级', color: '#FF9800', advice: '高血压1级，建议咨询医生，注意饮食和运动。' };
  if (systolic >= 120 && diastolic < 80) return { level: 'elevated', label: '偏高', color: '#FFC107', advice: '血压偏高，建议减少盐摄入、增加运动。' };
  return { level: 'normal', label: '正常', color: '#4CAF50', advice: '血压正常，继续保持健康生活方式。' };
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
}

function formatTime(dateStr) {
  const d = new Date(dateStr);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ============ Navigation ============
let currentPage = 'home';
let editRecordId = null;
let currentRecords = [];

function navigate(page, data) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');

  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('chartBtn').style.display = 'block';

  const titles = { home: '血压笔记', record: editRecordId ? '编辑记录' : '记录血压', history: '历史记录', charts: '血压趋势', settings: '设置' };
  document.getElementById('pageTitle').textContent = titles[page] || '血压笔记';

  if (page === 'home') renderHome();
  else if (page === 'record') initRecordForm(data);
  else if (page === 'history') renderHistory();
  else if (page === 'charts') { renderChart(); renderStats(); }
  else if (page === 'settings') updateSettingsCount();

  if (page === 'charts') document.getElementById('chartBtn').style.display = 'none';
}

function goBack() { navigate('home'); }

// ============ Toast ============
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ Modal ============
let modalCallback = null;
function showModal(title, msg, cb) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMessage').textContent = msg;
  document.getElementById('modal').classList.add('show');
  modalCallback = cb;
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  if (modalCallback) { modalCallback(); modalCallback = null; }
}

// ============ RECORD FORM ============
function initRecordForm(record) {
  if (record) {
    editRecordId = record.id;
    document.getElementById('recDate').value = record.date;
    document.getElementById('recTime').value = record.timestamp ? record.timestamp.substring(11, 16) : '08:00';
    document.getElementById('recSystolic').value = record.systolic;
    document.getElementById('recDiastolic').value = record.diastolic;
    document.getElementById('recHeartRate').value = record.heartRate;
    document.getElementById('recNotes').value = record.notes || '';
    document.getElementById('pageTitle').textContent = '编辑记录';
    document.getElementById('editActions').style.display = 'flex';
    document.getElementById('saveBtnSingle').style.display = 'none';
    document.getElementById('saveBtn').textContent = '保存修改';
  } else {
    editRecordId = null;
    const now = new Date();
    document.getElementById('recDate').value = now.toISOString().substring(0, 10);
    document.getElementById('recTime').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('recSystolic').value = '';
    document.getElementById('recDiastolic').value = '';
    document.getElementById('recHeartRate').value = '';
    document.getElementById('recNotes').value = '';
    document.getElementById('pageTitle').textContent = '记录血压';
    document.getElementById('editActions').style.display = 'none';
    document.getElementById('saveBtnSingle').style.display = 'block';
    document.getElementById('recPreview').style.display = 'none';
  }

  ['recSystolic', 'recDiastolic'].forEach(id => {
    document.getElementById(id).oninput = previewBP;
  });
}

function previewBP() {
  const sys = parseInt(document.getElementById('recSystolic').value);
  const dia = parseInt(document.getElementById('recDiastolic').value);
  const el = document.getElementById('recPreview');
  if (sys > 0 && dia > 0) {
    const r = classifyBP(sys, dia);
    el.style.display = 'block';
    el.style.background = `${r.color}15`;
    el.style.color = r.color;
    el.textContent = `状态：${r.label}`;
  } else {
    el.style.display = 'none';
  }
}

async function saveRecord(e) {
  e.preventDefault();
  const systolic = parseInt(document.getElementById('recSystolic').value);
  const diastolic = parseInt(document.getElementById('recDiastolic').value);
  const heartRate = parseInt(document.getElementById('recHeartRate').value);
  const date = document.getElementById('recDate').value;
  const time = document.getElementById('recTime').value || '08:00';
  const notes = document.getElementById('recNotes').value.trim();

  if (!systolic || systolic < 30 || systolic > 300) { showToast('请输入有效的收缩压（30-300）'); return; }
  if (!diastolic || diastolic < 30 || diastolic > 300) { showToast('请输入有效的舒张压（30-300）'); return; }
  if (!heartRate || heartRate < 20 || heartRate > 300) { showToast('请输入有效的心率（20-300）'); return; }

  const timestamp = `${date}T${time}:00`;

  if (editRecordId) {
    await updateRecord({ id: editRecordId, date, timestamp, systolic, diastolic, heartRate, notes });
    showToast('记录已更新');
  } else {
    const id = await addRecord({ date, timestamp, systolic, diastolic, heartRate, notes });
    showToast('记录已保存');
  }

  navigate('home');
}

function cancelEdit() {
  editRecordId = null;
  navigate('record');
}

function editRecord(id) {
  const record = currentRecords.find(r => r.id === id);
  if (record) navigate('record', record);
}

async function deleteRecordById(id) {
  await deleteRecord(id);
  showToast('记录已删除');
  navigate('home');
}

function confirmDeleteRecord(id) {
  showModal('删除记录', '确定要删除这条记录吗？此操作不可恢复。', async () => {
    await deleteRecord(id);
    showToast('记录已删除');
    navigate('home');
  });
}

// ============ HISTORY ============
async function renderHistory() {
  const records = await getAllRecords();
  const el = document.getElementById('historyContent');

  if (records.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">&#128214;</div><h3>暂无记录</h3><p>记录血压后，这里会显示完整历史</p></div>`;
    return;
  }

  // Group by date
  const groups = {};
  records.forEach(r => {
    const d = r.date;
    if (!groups[d]) groups[d] = [];
    groups[d].push(r);
  });

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-size:14px;color:var(--text-secondary)">共 ${records.length} 条记录</span>
  </div>`;

  Object.keys(groups).sort().reverse().forEach(date => {
    const items = groups[date];
    html += `<div class="card" style="padding:12px 16px;"><div style="font-size:14px;font-weight:500;margin-bottom:4px;">${formatDate(date)} <span style="font-size:13px;color:var(--text-secondary);font-weight:400;">共 ${items.length} 条</span></div>`;
    items.forEach(r => {
      const s = classifyBP(r.systolic, r.diastolic);
      html += `
        <div class="record-item" onclick="editRecord(${r.id})">
          <div class="record-indicator" style="background:${s.color}"></div>
          <div class="record-info">
            <div class="record-bp">${r.systolic}/${r.diastolic} <span style="font-size:13px;font-weight:400;color:var(--text-secondary)">mmHg</span></div>
          </div>
          <div style="text-align:right;">
            <div class="record-time">${formatTime(r.timestamp || r.date)}</div>
            <div style="display:flex;gap:4px;margin-top:4px;align-items:center;justify-content:flex-end;">
              <span class="record-tag" style="background:${s.color}15;color:${s.color}">${s.label}</span>
              <button class="btn-icon" style="font-size:16px;padding:2px 4px;color:var(--danger);" onclick="event.stopPropagation();confirmDeleteRecord(${r.id})">&#128465;</button>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  html += `<div style="height:16px"></div>`;
  el.innerHTML = html;
}

// ============ CHARTS ============
let chartPeriod = 'week';

function renderChart() {
  const periodBtns = document.querySelectorAll('.period-btn');
  periodBtns.forEach(btn => {
    btn.onclick = () => {
      periodBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      chartPeriod = btn.dataset.period;
      renderChart();
      renderStats();
    };
  });

  const records = getFilteredRecords();
  const canvas = document.getElementById('bpChart');
  const ctx = canvas.getContext('2d');
  const container = canvas.parentElement;
  const chartEmpty = document.getElementById('chartEmpty');

  const dpr = window.devicePixelRatio || 1;
  const rect = container.getBoundingClientRect();
  const w = rect.width - 32;
  const h = 260;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.scale(dpr, dpr);

  if (records.length < 2) {
    chartEmpty.style.display = 'block';
    ctx.clearRect(0, 0, w, h);
    return;
  }
  chartEmpty.style.display = 'none';

  const padding = { top: 20, bottom: 30, left: 36, right: 16 };
  const chartW = w - padding.left - padding.right;
  const chartH = h - padding.top - padding.bottom;

  const vals = records.flatMap(r => [r.systolic, r.diastolic]);
  const minVal = Math.min(...vals) - 10;
  const maxVal = Math.max(...vals) + 10;
  const yMin = Math.max(0, Math.floor(minVal / 20) * 20);
  const yMax = Math.ceil(maxVal / 20) * 20;

  ctx.clearRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  const ySteps = (yMax - yMin) / 20;
  for (let i = 0; i <= ySteps; i++) {
    const y = padding.top + chartH - (i / ySteps) * chartH;
    ctx.beginPath(); ctx.moveTo(padding.left, y); ctx.lineTo(w - padding.right, y); ctx.stroke();
    ctx.fillStyle = '#9E9E9E'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(String(yMin + i * 20), padding.left - 8, y + 4);
  }
  ctx.setLineDash([]);

  // X labels
  ctx.fillStyle = '#9E9E9E';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(records.length / 6));
  records.forEach((r, i) => {
    if (i % step === 0 || i === records.length - 1) {
      const x = padding.left + (i / (records.length - 1)) * chartW;
      const d = new Date(r.timestamp || r.date);
      ctx.fillText(`${d.getMonth()+1}/${d.getDate()}`, x, h - 4);
    }
  });

  // Draw lines
  function drawLine(data, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    data.forEach((val, i) => {
      const x = padding.left + (i / (data.length - 1)) * chartW;
      const y = padding.top + chartH - ((val - yMin) / (yMax - yMin)) * chartH;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Area fill
    ctx.lineTo(padding.left + chartW, padding.top + chartH);
    ctx.lineTo(padding.left, padding.top + chartH);
    ctx.closePath();
    ctx.fillStyle = color + '18';
    ctx.fill();

    // Dots
    if (records.length <= 30) {
      data.forEach((val, i) => {
        const x = padding.left + (i / (data.length - 1)) * chartW;
        const y = padding.top + chartH - ((val - yMin) / (yMax - yMin)) * chartH;
        ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }
  }

  const sysData = records.map(r => r.systolic);
  const diaData = records.map(r => r.diastolic);
  drawLine(sysData, '#4CAF50');
  drawLine(diaData, '#FFC107');
}

function getFilteredRecords() {
  const now = new Date();
  let start;
  switch (chartPeriod) {
    case 'week': start = new Date(now - 7 * 86400000); break;
    case 'month': start = new Date(now - 30 * 86400000); break;
    case 'quarter': start = new Date(now - 90 * 86400000); break;
    default: start = new Date(now - 7 * 86400000);
  }
  return currentRecords.filter(r => new Date(r.timestamp || r.date) >= start).reverse();
}

// ============ STATS ============
async function renderStats() {
  const el = document.getElementById('statsContent');
  const records = getFilteredRecords();

  if (records.length === 0) {
    el.innerHTML = '';
    return;
  }

  const avgSys = Math.round(records.reduce((s, r) => s + r.systolic, 0) / records.length);
  const avgDia = Math.round(records.reduce((s, r) => s + r.diastolic, 0) / records.length);
  const avgHr = Math.round(records.reduce((s, r) => s + r.heartRate, 0) / records.length);
  const maxSys = Math.max(...records.map(r => r.systolic));
  const minSys = Math.min(...records.map(r => r.systolic));
  const normalCount = records.filter(r => classifyBP(r.systolic, r.diastolic).level === 'normal').length;
  const normalRate = Math.round(normalCount / records.length * 100);

  const periodLabel = { week: '近7日', month: '近30日', quarter: '近90日' };
  const label = periodLabel[chartPeriod] || '近7日';

  el.innerHTML = `
    <div class="section-title" style="margin-top:4px;"><h2>${label}统计</h2></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon" style="color:#1976D2">&#128200;</div><div class="stat-label">平均血压</div><div class="stat-value">${avgSys}/${avgDia}<span class="stat-unit"> mmHg</span></div></div>
      <div class="stat-card"><div class="stat-icon" style="color:#26C6DA">&#128147;</div><div class="stat-label">平均心率</div><div class="stat-value">${avgHr}<span class="stat-unit"> bpm</span></div></div>
      <div class="stat-card"><div class="stat-icon" style="color:#F44336">&#8593;</div><div class="stat-label">最高收缩压</div><div class="stat-value">${maxSys}<span class="stat-unit"> mmHg</span></div></div>
      <div class="stat-card"><div class="stat-icon" style="color:#4CAF50">&#8595;</div><div class="stat-label">最低收缩压</div><div class="stat-value">${minSys}<span class="stat-unit"> mmHg</span></div></div>
    </div>
    <div class="card" style="margin-top:8px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:14px;color:var(--text-secondary)">血压正常率</span>
        <span style="font-size:22px;font-weight:700;color:#4CAF50">${normalRate}%</span>
      </div>
      <div style="margin-top:8px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;">
        <div style="height:100%;width:${normalRate}%;background:#4CAF50;border-radius:3px;transition:width .3s;"></div>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">正常 ${normalCount} / 共 ${records.length} 天</div>
    </div>`;
}

// ============ EXPORT CSV ============
async function exportCSV() {
  const records = await getAllRecords();
  if (records.length === 0) { showToast('暂无数据可导出'); return; }

  let csv = '﻿日期,时间,收缩压,舒张压,心率,备注\n';
  records.reverse().forEach(r => {
    const d = new Date(r.timestamp || r.date);
    const date = r.date;
    const time = formatTime(r.timestamp || r.date);
    csv += `${date},${time},${r.systolic},${r.diastolic},${r.heartRate},"${r.notes || ''}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `血压数据_${new Date().toISOString().substring(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}
